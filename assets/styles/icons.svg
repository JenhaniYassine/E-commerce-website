<!-- 2WHY Brand Icon System -->
<!-- Minimalist, Geometric Icons for Modern UI -->

<svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <defs>

        <!-- ============================================
             BRAND & NAVIGATION ICONS
             ============================================ -->

        <!-- 2Why Logo Icon -->
        <symbol id="icon-2why-logo" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2"/>
            <text x="24" y="32" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="bold" fill="currentColor">2W</text>
        </symbol>

        <!-- Home Icon -->
        <symbol id="icon-home" viewBox="0 0 24 24">
            <path d="M3 12l9-9 9 9M5 12v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8M9 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Search Icon -->
        <symbol id="icon-search" viewBox="0 0 24 24">
            <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M15 15l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- Menu Icon -->
        <symbol id="icon-menu" viewBox="0 0 24 24">
            <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- Back/Chevron Left -->
        <symbol id="icon-back" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Close/X Icon -->
        <symbol id="icon-close" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- ============================================
             ACTION ICONS
             ============================================ -->

        <!-- Plus/Add Icon -->
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- Minus Icon -->
        <symbol id="icon-minus" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- Edit Icon -->
        <symbol id="icon-edit" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" fill="currentColor"/>
            <path d="M3 12.5h2.26l1.39 3.41h2.6L6.25 12.5H8.5V11h-5.5v1.5zm12 0h2.26v-1.5H10v1.5h2.25l1.39 3.41h2.6l-2.99-3.41z" fill="currentColor"/>
        </symbol>

        <!-- Delete/Trash Icon -->
        <symbol id="icon-delete" viewBox="0 0 24 24">
            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-9l-1 1H5v2h14V4z" fill="currentColor"/>
        </symbol>

        <!-- Download Icon -->
        <symbol id="icon-download" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7z" fill="currentColor"/>
            <path d="M5 18h14v2H5z" fill="currentColor"/>
        </symbol>

        <!-- Upload Icon -->
        <symbol id="icon-upload" viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
        </symbol>

        <!-- Share Icon -->
        <symbol id="icon-share" viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2"/>
        </symbol>

        <!-- Save/Check Icon -->
        <symbol id="icon-save" viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
        </symbol>

        <!-- Filter Icon -->
        <symbol id="icon-filter" viewBox="0 0 24 24">
            <path d="M3 6h18v2H3V6zm2 5h14v2H5v-2zm4 5h6v2H9v-2z" fill="currentColor"/>
        </symbol>

        <!-- Sort Icon -->
        <symbol id="icon-sort" viewBox="0 0 24 24">
            <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z" fill="currentColor"/>
        </symbol>

        <!-- Settings Icon -->
        <symbol id="icon-settings" viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.1-.64l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.13.23-.09.5.1.64l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.1.64l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.5-.1-.64l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
        </symbol>

        <!-- ============================================
             COMMERCE ICONS
             ============================================ -->

        <!-- Shopping Cart Icon -->
        <symbol id="icon-cart" viewBox="0 0 24 24">
            <circle cx="9" cy="21" r="1" fill="currentColor"/>
            <circle cx="20" cy="21" r="1" fill="currentColor"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Wishlist/Heart Icon -->
        <symbol id="icon-heart" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Filled Heart Icon -->
        <symbol id="icon-heart-filled" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
        </symbol>

        <!-- Shopping Bag Icon -->
        <symbol id="icon-bag" viewBox="0 0 24 24">
            <path d="M6 2h12v3H6V2zm0 5h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Delivery Truck Icon -->
        <symbol id="icon-delivery" viewBox="0 0 24 24">
            <path d="M18 18.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" fill="currentColor"/>
            <path d="M9 18.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" fill="currentColor"/>
            <path d="M20 8h-3V4a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v13h2a3 3 0 0 0 3 3 3 3 0 0 0 3-3h6a3 3 0 0 0 3 3 3 3 0 0 0 3-3h2v-5l-2-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Payment/Credit Card Icon -->
        <symbol id="icon-credit-card" viewBox="0 0 24 24">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="1" y1="10" x2="23" y2="10" stroke="currentColor" stroke-width="2"/>
        </symbol>

        <!-- ============================================
             STATUS & FEEDBACK ICONS
             ============================================ -->

        <!-- Check/Success Icon -->
        <symbol id="icon-check" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Check Circle -->
        <symbol id="icon-check-circle" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
            <polyline points="16 12 11 17 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- X/Error Icon -->
        <symbol id="icon-x" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- Alert/Warning Icon -->
        <symbol id="icon-alert" viewBox="0 0 24 24">
            <path d="M12 2L2 20h20L12 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="17" r="1" fill="currentColor"/>
        </symbol>

        <!-- Info Icon -->
        <symbol id="icon-info" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="8" r="1" fill="currentColor"/>
        </symbol>

        <!-- Loading/Spinner Icon -->
        <symbol id="icon-loading" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
            <path d="M12 2a10 10 0 0 1 0 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- ============================================
             COMMUNICATION ICONS
             ============================================ -->

        <!-- Chat/Message Icon -->
        <symbol id="icon-chat" viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Phone Icon -->
        <symbol id="icon-phone" viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Email Icon -->
        <symbol id="icon-email" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M2 6l10 7 10-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Help/Question Icon -->
        <symbol id="icon-help" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2"/>
            <text x="12" y="16" text-anchor="middle" font-size="16" font-weight="bold" fill="currentColor" font-family="Arial, sans-serif">?</text>
        </symbol>

        <!-- ============================================
             USER & PROFILE ICONS
             ============================================ -->

        <!-- User Profile Icon -->
        <symbol id="icon-user" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- Logout Icon -->
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="17 16 21 12 17 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>

        <!-- ============================================
             EMPTY STATE ILLUSTRATIONS
             ============================================ -->

        <!-- Empty Cart Illustration -->
        <symbol id="icon-empty-cart" viewBox="0 0 200 150">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Cart outline -->
                <path d="M30 60 L50 30 L150 30 L170 60 L30 60 Z"/>
                <path d="M50 30 L55 100 Q55 110 65 110 L135 110 Q145 110 145 100 L150 30"/>
                <circle cx="75" cy="115" r="5"/>
                <circle cx="125" cy="115" r="5"/>
                <!-- Empty circle with question mark -->
                <circle cx="100" cy="70" r="15" stroke-dasharray="5,5"/>
                <text x="100" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="currentColor">?</text>
            </g>
        </symbol>

        <!-- Empty Wishlist Illustration -->
        <symbol id="icon-empty-wishlist" viewBox="0 0 200 150">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Heart outline -->
                <path d="M100 50 C90 40 75 40 65 50 C55 60 55 75 65 85 L100 115 L135 85 C145 75 145 60 135 50 C125 40 110 40 100 50 Z"/>
                <!-- Empty indicator -->
                <circle cx="100" cy="80" r="12" stroke-dasharray="3,3"/>
                <text x="100" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="currentColor">?</text>
            </g>
        </symbol>

        <!-- Empty Orders Illustration -->
        <symbol id="icon-empty-orders" viewBox="0 0 200 150">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Package/box outline -->
                <path d="M60 50 L100 30 L140 50 L140 100 L60 100 Z"/>
                <line x1="100" y1="30" x2="100" y2="80"/>
                <line x1="60" y1="50" x2="100" y2="80"/>
                <line x1="140" y1="50" x2="100" y2="80"/>
                <!-- Empty indicator -->
                <circle cx="100" cy="75" r="12" stroke-dasharray="3,3"/>
                <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="currentColor">?</text>
            </g>
        </symbol>

        <!-- Empty Search Results -->
        <symbol id="icon-empty-search" viewBox="0 0 200 150">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Search icon -->
                <circle cx="70" cy="50" r="25"/>
                <line x1="90" y1="70" x2="110" y2="90"/>
                <!-- Slash through (no results) -->
                <line x1="30" y1="130" x2="170" y2="30" stroke-width="3" opacity="0.3"/>
            </g>
        </symbol>

    </defs>
</svg>
